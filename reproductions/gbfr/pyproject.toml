[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbfr-paper"
version = "0.1.0"
description = "Paper-first implementation of Graph-Bounded Financial Reasoning"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "sympy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gbfr = "gbfr.cli:main"

[tool.setuptools.packages.find]
include = ["gbfr*"]

[tool.setuptools.package-data]
gbfr = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tmp/pytest"
