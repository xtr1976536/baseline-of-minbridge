[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financereasoning-table5"
version = "0.1.0"
description = "Paper-first reproduction of FinanceReasoning Table 5 best GPT-4o method"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "numpy>=2,<3", "torch>=2.6,<3", "transformers>=4.48,<6", "huggingface-hub>=0.28,<3", "scipy>=1.14,<2", "sympy>=1.13,<2", "numpy-financial==1.0.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fr-table5 = "fr_repro.cli:main"

[tool.setuptools.packages.find]
include = ["fr_repro*"]

[tool.setuptools.package-data]
fr_repro = ["prompts.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tmp/pytest"
